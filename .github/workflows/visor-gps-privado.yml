name: Actualizar visor GPS privado en Cloudflare

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas gspread google-auth pyvis folium

      - name: Generar visor GPS
        env:
          GPS_SPREADSHEET_ID: "1n-edOD5p1K99m2m78SoTlJSnXDU_rY69Vxk5yttPgHg"
        run: |
          python generar_mapa_gps.py

      - name: Preparar archivos para Cloudflare
        run: |
          mkdir -p cloudflare-gps
          mv docs/rutas_gps.html cloudflare-gps/index.html

      - name: Desplegar visor GPS privado en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
